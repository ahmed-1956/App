<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="نحو التغيير — عاداتك ومهامك ويومياتك في مكان واحد." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>نحو التغيير</title>
  
<style>
#app-splash {
  position: fixed; inset: 0; z-index: 99999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; background: #101114; color: #F5F5F5;
  font-family: system-ui, sans-serif;
}
#app-splash .splash-mark {
  display: grid; place-items: center;
  width: 68px; height: 68px; border-radius: 22px;
  background: #D6B36A; color: #101114;
  font-size: 38px; font-weight: 800;
}
#app-splash .splash-title {
  font-size: 22px; font-weight: 700;
}
#app-splash:empty { display: none; }
</style>

</head>
  <body>
    <div id="app-splash" aria-label="نحو التغيير">
  <div class="splash-mark">ن</div>
  <div class="splash-title">نحو التغيير</div>
</div>
<div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  
<script>
(() => {
  const splash = document.getElementById('app-splash');
  const root = document.getElementById('root');
  if (!splash || !root) return;
  const removeSplash = () => {
    if (root.childElementCount > 0) {
      splash.remove();
      observer.disconnect();
    }
  };
  const observer = new MutationObserver(removeSplash);
  observer.observe(root, { childList: true });
  removeSplash();
})();
</script>

</body>
</html>
